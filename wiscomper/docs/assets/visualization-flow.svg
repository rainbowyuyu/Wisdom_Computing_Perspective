" y="253" width="3" height="39" rx="1.5" fill="#7a73c0"/><g font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="804" y="265" font-size="21" font-weight="600" fill="#7a73c0">Three.js</text><text x="805" y="295" font-size="17" fill="#596987">三维场景</text><text x="805" y="326" font-size="14" fill="#919ab1">构件 · 空间关系 · 运动</text></g><rect x="468" y="375" width="292" height="123" rx="15" fill="#f5f5fc" stroke="#e5e7f3"/><rect x="468" y="395" width="3" height="39" rx="1.5" fill="#9374bb"/><g font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="489" y="407" font-size="21" font-weight="600" fill="#9374bb">Manim</text><text x="490" y="437" font-size="17" fill="#596987">公式与几何</text><text x="490" y="468" font-size="14" fill="#919ab1">公式变形 · 二维视频</text></g><rect x="783" y="375" width="292" height="123" rx="15" fill="#f5f5fc" stroke="#e5e7f3"/><rect x="783" y="395" width="3" height="39" rx="1.5" fill="#5f96a8"/><g font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="804" y="407" font-size="21" font-weight="600" fill="#5f96a8">Trusted recipes</text><text x="805" y="437" font-size="17" fill="#596987">数值构建</text><text x="805" y="468" font-size="14" fill="#919ab1">条件明确的参数实验</text></g><circle cx="1193" cy="256" r="17" fill="#efedf9"/><text x="1193" y="261" text-anchor="middle" font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="13" fill="#8983b5">01</text><g font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="1226" y="251" font-size="20" font-weight="600" fill="#64729b">Interact</text><text x="1226" y="279" font-size="17" fill="#62728d">观察与交互</text><text x="1226" y="303" font-size="13" fill="#8d99af">播放、视角与有边界的参数</text></g><circle cx="1193" cy="346" r="17" fill="#efedf9"/><text x="1193" y="351" text-anchor="middle" font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="13" fill="#8983b5">02</text><g font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="1226" y="341" font-size="20" font-weight="600" fill="#64729b">Revise</text><text x="1226" y="369" font-size="17" fill="#62728d">同一项目，继续修改</text><text x="1226" y="393" font-size="13" fill="#8d99af">保存变化，回看历史版本</text></g><circle cx="1193" cy="436" r="17" fill="#efedf9"/><text x="1193" y="441" text-anchor="middle" font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="13" fill="#8983b5">03</text><g font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="1226" y="431" font-size="20" font-weight="600" fill="#64729b">Export</text><text x="1226" y="459" font-size="17" fill="#62728d">留下作品</text><text x="1226" y="483" font-size="13" fill="#8d99af">Scene JSON / MP4¹</text></g><g font-family="Inter,Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="63" y="581" font-size="14" fill="#8691aa">通用场景用于解释关系；数值方案明确模型与假设。¹ 视频导出需安装对应渲染环境。</text><text x="63" y="609" font-size="13" fill="#9ca5ba">Generic scenes explain relationships. Numerical recipes state their assumptions. Video export requires the corresponding render tools.</text></g></svg>